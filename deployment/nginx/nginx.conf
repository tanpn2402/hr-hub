events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

        # ----------------------------------------
        # HR Hub Web
        # /hr-hub/*
        # ----------------------------------------

        location /hr-hub/ {
            root /dist;

            try_files $uri $uri/ /hr-hub/index.html;
        }

        # ----------------------------------------
        # HR Hub API
        # /hr-hub/api/*
        #
        # /hr-hub/api/employees
        # -> http://hr-hub-api:3000/employees
        # ----------------------------------------

        location /hr-hub/api/ {
            proxy_pass http://hr-hub-api:3000/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ----------------------------------------
        # Idenplane Admin
        # /console/*
        # ----------------------------------------

        location /console/ {
            root /dist;

            try_files $uri $uri/ /console/index.html;
        }

        # ----------------------------------------
        # Idenplane
        # /realms/*
        # ----------------------------------------

        location /realms/ {
            proxy_pass http://idenplane:3001/realms/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location /admin/ {
            proxy_pass http://idenplane:3001/admin/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location /themes/ {
            proxy_pass http://idenplane:3001/themes/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location = / {
            return 302 /hr-hub/;
        }
    }
}