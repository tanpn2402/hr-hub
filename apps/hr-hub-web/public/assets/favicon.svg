<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FFFC"/>
      <stop offset="0.55" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>

  <!-- left person -->
  <circle cx="42" cy="35" r="12" fill="#FFFFFF"/>
  <rect x="31" y="50" width="22" height="47" rx="11" fill="#FFFFFF"/>

  <!-- right person -->
  <circle cx="86" cy="35" r="12" fill="#6EE7B7"/>
  <rect x="75" y="50" width="22" height="47" rx="11" fill="#34D399"/>

  <!-- connecting / handshake stroke -->
  <path d="M43 73 C54 72 62 67 71 60 C76 56 82 56 87 61"
        fill="none" stroke="url(#arm)" stroke-width="17" stroke-linecap="round"/>
</svg>